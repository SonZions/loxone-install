services:
  mcp:
    build: .
    image: loxone-mcp:local
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "127.0.0.1:18089:8080"
    volumes:
      - /etc/loxone-mcp/config.json:/run/secrets/config.json:ro
      - /etc/loxone-mcp/policy.json:/run/secrets/policy.json:ro
      - /var/lib/loxone-mcp:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
